<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyric Writer</title>
<meta name="theme-color" content="#141418">
<meta name="description" content="Offline lyric writer: sections, chords, rhymes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the shared suite theme before first paint (no flash). Key is shared across studio apps on this origin.
  try {
    var t = localStorage.getItem('studio.theme');
    if (t === 'dark' || t === 'gray' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<header id="topbar">
  <button id="btn-menu" class="btn icon" aria-label="Toggle song library" title="Songs">☰</button>
  <div class="brand">Lyric Writer</div>
  <div class="spacer"></div>
  <span id="save-state" class="save-state" aria-live="polite">Loading…</span>
  <button id="btn-data" class="btn" title="Import lyrics, export, backup and restore">Import / Export</button>
  <button id="btn-history" class="btn" title="Restore an earlier version of this song" hidden>History</button>
  <button id="btn-theme" class="btn" title="Switch theme">Dark</button>
</header>

<div id="layout">
  <aside id="library" aria-label="Song library">
    <div class="lib-tools">
      <input id="search" type="search" placeholder="Search songs, lyrics, notes…" aria-label="Search songs" autocomplete="off">
      <div class="lib-row">
        <select id="group-by" aria-label="Group songs">
          <option value="release">Group: Album / Pool</option>
          <option value="recent">Recently edited</option>
          <option value="az">A–Z</option>
        </select>
        <button id="btn-new" class="btn primary">+ New</button>
      </div>
      <div class="lib-row">
        <button id="btn-trash" class="btn small ghost" aria-pressed="false">Trash</button>
        <span id="lib-count" class="muted small"></span>
      </div>
    </div>
    <div id="song-list" class="song-list"></div>
  </aside>

  <main id="editor" aria-label="Song editor"></main>
  <aside id="rhymes" aria-label="Rhyme finder" hidden></aside>
</div>

<div id="scrim" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:2rem">Lyric Writer needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
